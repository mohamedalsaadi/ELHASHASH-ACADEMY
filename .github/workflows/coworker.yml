name: Coworker

# Wakes Sentinel, the site-log coworker, every 30 minutes. Vercel's own cron on the current plan runs once a day at most,
# so GitHub does the ticking. It only calls the site's cron route; everything it does is in src/lib/coworker.
# Needs repository secrets APP_URL (https://dhirwa.ae) and CRON_SECRET (the same value as in Vercel).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: coworker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Sentinel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A value pasted into a secret often carries a space or a line break; strip them.
          APP_URL=$(printf %s "$APP_URL" | tr -d ' \r\n')
          CRON_SECRET=$(printf %s "$CRON_SECRET" | tr -d ' \r\n')
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          code=$(curl --silent --show-error --max-time 90 -o body.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/coworker")
          echo "HTTP $code"
          head -c 600 body.json
          echo
          test "$code" = "200"
