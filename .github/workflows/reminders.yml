# Vercel Hobby runs crons once a day; live-session reminders need every 10 minutes.
# Needs two repository secrets: APP_URL (https://dhirwa.ae) and CRON_SECRET (the same value as in Vercel).
name: Reminders
# Scheduled reminders are switched off for now: `vercel.json` has no crons and this workflow has
# no schedule, so nothing calls /api/cron/reminders on its own. The route is kept for when they
# come back; manual dispatch still works once CRON_SECRET matches Vercel.
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/reminders"
