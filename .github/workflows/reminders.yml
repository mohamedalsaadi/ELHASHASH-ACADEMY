name: Reminders
# Every ten minutes, because the live-lecture reminder is a 5–25 minute window and Vercel Hobby can
# only run a daily cron. Both need CRON_SECRET to match Vercel's value; without it the route answers
# 401 and this job goes red, which is the visible signal that the secret is wrong.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/reminders"
